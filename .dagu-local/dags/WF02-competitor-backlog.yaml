description: "WF02 - Competitor and keyword data to local priority backlog."
type: chain
working_dir: "C:/Users/Admin/youtube/dagu"
dotenv: []
shell: "powershell.exe"
shell_args:
  - "-NoProfile"
  - "-ExecutionPolicy"
  - "Bypass"
  - "-Command"
steps:
  - id: validate_run_records
    run: Set-Location C:\Users\Admin\youtube; python scripts\validate_run_record.py outputs\runs
  - id: build_data_layer_from_exports
    run: Set-Location C:\Users\Admin\youtube; python scripts\youtube_data_layer.py azzam_search.json gta_search.json --output-dir data\processed
  - id: rank_remake_candidates
    run: Set-Location C:\Users\Admin\youtube; python scripts\rank_remake_candidates.py --inventory data\processed\video_inventory_api.csv --output data\processed\remake_candidates_api.csv --limit 50
  - id: enrich_topics
    run: Set-Location C:\Users\Admin\youtube; python scripts\youtube_workflow_enrich.py --root . --candidates data\processed\remake_candidates_api.csv --limit 12
  - id: refresh_dashboard
    run: Set-Location C:\Users\Admin\youtube; python scripts\daily_report_renderer.py --root . --date 2026-10-01
  - id: final_note
    run: Write-Host "WF02 backlog refreshed locally. Paid/bulk transcript use still requires approval."
