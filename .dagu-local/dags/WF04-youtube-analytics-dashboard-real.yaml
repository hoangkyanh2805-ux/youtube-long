description: "WF04 - Refresh the cloned YouTube Analytics Dashboard with real YouTube Data API data and optional OAuth analytics."
type: chain
working_dir: "C:/Users/Admin/youtube/dagu"
dotenv: []
shell: "powershell.exe"
shell_args:
  - "-NoProfile"
  - "-ExecutionPolicy"
  - "Bypass"
  - "-Command"
steps:
  - id: validate_run_records
    run: Set-Location C:\Users\Admin\youtube; python scripts\validate_run_record.py outputs\runs
  - id: refresh_real_youtube_dashboard
    run: Set-Location C:\Users\Admin\youtube; python scripts\refresh_youtube_analytics_dashboard.py
  - id: dashboard_url
    run: Write-Host "Open file:///C:/Users/Admin/youtube/outputs/dashboard/youtube-analytics-real.html"
