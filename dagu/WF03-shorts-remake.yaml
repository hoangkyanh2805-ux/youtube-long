description: "WF03 - Long video/remake candidates to Shorts and asset package drafts."
type: chain
working_dir: "C:/Users/Admin/youtube/dagu"
dotenv: []
shell: "powershell.exe"
shell_args:
  - "-NoProfile"
  - "-ExecutionPolicy"
  - "Bypass"
  - "-Command"
steps:
  - id: validate_run_records
    run: Set-Location C:\Users\Admin\youtube; python scripts\validate_run_record.py outputs\runs
  - id: enrich_remake_candidates
    run: Set-Location C:\Users\Admin\youtube; python scripts\youtube_workflow_enrich.py --root . --candidates data\processed\remake_candidates_api.csv --limit 8
  - id: generate_shorts_package
    run: Set-Location C:\Users\Admin\youtube; python scripts\content_bridge.py --candidates data\processed\remake_candidates_api.csv --output-dir outputs\content --short-limit 5 --live-limit 1
  - id: refresh_dashboard
    run: Set-Location C:\Users\Admin\youtube; python scripts\daily_report_renderer.py --root . --date 2026-10-01
  - id: final_note
    run: Write-Host "WF03 local Shorts/remake package generated. Editor and Alan approval required before publishing."
