description: "WF11 - Approved content brief to editor: push the day's 3 Shorts + 1 Long brief to the Telegram EDIT topic."
type: chain
working_dir: "C:/Users/Admin/youtube/dagu"
dotenv: []
shell: "powershell.exe"
shell_args:
  - "-NoProfile"
  - "-ExecutionPolicy"
  - "Bypass"
  - "-Command"
steps:
  - id: validate_run_records
    run: Set-Location C:\Users\Admin\youtube; python scripts\validate_run_record.py outputs\runs

  - id: rebuild_strategy
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_strategy.py

  - id: rebuild_playbook
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_mrbeast_playbook.py

  - id: refresh_dashboard
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_ops_dashboard.py

  - id: report_to_edit_topic
    run: Set-Location C:\Users\Admin\youtube; python scripts\telegram_reporter.py --report content_brief --send --approve APPROVE

  - id: final_note
    run: Write-Host "WF11 done. Editor picks up the brief in the EDIT topic (thread 205). Daily KPI is 3 Shorts plus 1 Long."
