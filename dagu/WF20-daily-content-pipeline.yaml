description: "WF20 - Daily content pipeline: crawl comments, score pain points, push brief to the EDIT topic, and post health to GENERAL."
type: chain
working_dir: "C:/Users/Admin/youtube/dagu"
dotenv: []
shell: "powershell.exe"
shell_args:
  - "-NoProfile"
  - "-ExecutionPolicy"
  - "Bypass"
  - "-Command"
schedule: "30 7 * * *"
hist_retention_days: 30
tags:
  - daily
  - content
steps:
  - id: sync_workflows
    run: Set-Location C:\Users\Admin\youtube; python scripts\sync_dagu_workflows.py

  - id: validate_run_records
    run: Set-Location C:\Users\Admin\youtube; python scripts\validate_run_record.py outputs\runs

  - id: scrape_comments
    run: Set-Location C:\Users\Admin\youtube; python scripts\competitor_longform_scrape.py

  - id: score_painpoints
    run: Set-Location C:\Users\Admin\youtube; python scripts\extract_painpoints.py outputs\competitor_longform\raw_comments.json --output-dir outputs\competitor_longform --actor youtube-data-api-v3/commentThreads.list

  - id: rebuild_strategy
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_strategy.py

  - id: rebuild_dashboard
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_ops_dashboard.py

  - id: brief_to_editor
    run: Set-Location C:\Users\Admin\youtube; python scripts\telegram_reporter.py --report content_brief --send --approve APPROVE

  - id: painpoints_for_approval
    run: Set-Location C:\Users\Admin\youtube; python scripts\telegram_reporter.py --report comment --send --approve APPROVE

  - id: final_note
    run: Write-Host "WF20 complete. Alan approves pain points in the COMMENT topic, then the editor works from the EDIT topic."
