description: "WF22 - Daily content pipeline with a human approval gate. Crawls comments, scores pain points, then WAITS in the dagu UI for Alan to approve before the brief reaches the editor."
type: graph
working_dir: "C:/Users/Admin/youtube/dagu"
dotenv: []
shell: "powershell.exe"
shell_args:
  - "-NoProfile"
  - "-ExecutionPolicy"
  - "Bypass"
  - "-Command"
schedule: "30 7 * * *"
hist_retention_days: 30
tags:
  - daily
  - content
  - approval-gate
steps:
  - id: sync_workflows
    run: Set-Location C:\Users\Admin\youtube; python scripts\sync_dagu_workflows.py

  - id: validate_run_records
    run: Set-Location C:\Users\Admin\youtube; python scripts\validate_run_record.py outputs\runs

  - id: scrape_comments
    run: Set-Location C:\Users\Admin\youtube; python scripts\competitor_longform_scrape.py

  - id: score_painpoints
    run: Set-Location C:\Users\Admin\youtube; python scripts\extract_painpoints.py outputs\competitor_longform\raw_comments.json --output-dir outputs\competitor_longform --actor youtube-data-api-v3/commentThreads.list

  - id: rebuild_strategy
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_strategy.py

  # ── Dây chuyền sản xuất: sinh gói cho editor TRƯỚC approval gate ────────
  # Thứ tự quan trọng: P06 (chọn phân khúc) → P10 (SEO) → P11 (thumbnail)
  # → P05 (đa nền tảng + editor handoff) → checklist 30 ngày.
  # Alan duyệt xong mới tới brief_to_editor, nên editor nhận gói đã duyệt.

  - id: build_audience_segments
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_audience_segments.py

  - id: build_seo_packages
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_seo_packages.py
    depends: [build_audience_segments]

  - id: build_thumbnail_concepts
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_thumbnail_concepts.py
    depends: [build_seo_packages]

  - id: build_repurpose_packages
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_repurpose_packages.py
    depends: [build_seo_packages]

  - id: build_production_checklist
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_production_checklist.py
    depends: [build_repurpose_packages, build_thumbnail_concepts]

  - id: rebuild_dashboard
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_ops_dashboard.py
    depends: [build_production_checklist]

  # Trang hướng dẫn PHẢI sinh SAU khi có đủ dữ liệu — nếu chạy trước, guide
  # trỏ tới file chưa tồn tại (hoặc bản cũ) → link chết trong guide.
  - id: build_sop_guides
    run: Set-Location C:\Users\Admin\youtube; python scripts\build_sop_guides.py
    depends: [rebuild_dashboard]

  - id: send_painpoints_for_review
    run: Set-Location C:\Users\Admin\youtube; python scripts\telegram_reporter.py --report comment --send --approve APPROVE
    depends: [build_sop_guides]

  # Gửi luôn kết quả dây chuyền sản xuất để Alan có đủ số liệu trước khi duyệt
  - id: send_production_pipeline
    run: Set-Location C:\Users\Admin\youtube; python scripts\telegram_reporter.py --report production_pipeline --send --approve APPROVE
    depends: [rebuild_dashboard]

  # ── APPROVAL GATE ────────────────────────────────────────────────────────
  # Pipeline stops here. Alan opens the dagu UI, reads the artifact, and either
  # completes the task (pipeline continues to the editor brief) or pushes it
  # back to rebuild_strategy with feedback (pipeline rewinds and re-runs).
  - id: approve_content_brief
    action: human.task
    depends: [send_painpoints_for_review, send_production_pipeline, rebuild_strategy]
    with:
      prompt: >-
        Alan: kiểm tra pain point ở topic COMMENT và gói sản xuất ở topic EDIT
        (phân khúc / SEO / thumbnail / 5 định dạng / checklist 30 ngày).
        Approve để gửi brief hôm nay (3 Short + 1 Long) cho editor,
        hoặc push back kèm feedback để dựng lại strategy.
      artifacts:
        - ops-dashboard.html
        - AUDIENCE_SEGMENTS.md
        - SEO_PACKAGES.md
        - DESIGN_BRIEF.md
        - EDITOR_HANDOFF.md
      form:
        type: object
        title: Content approval
        properties:
          decision:
            type: string
            title: Decision
            description: Approve to release the brief, or reject to stop the pipeline.
            enum:
              - approve
              - reject
          note:
            type: string
            title: Note (optional)
            description: Why, or what to change next time.
            maxLength: 500
        required:
          - decision
      push_back:
        rewind_to: rebuild_strategy
        form:
          type: object
          title: Feedback to rebuild the strategy
          properties:
            feedback:
              type: string
              title: What to change
              description: Which pain points to drop, or which angle to prioritise.
              maxLength: 500
          required:
            - feedback

  - id: brief_to_editor
    run: Set-Location C:\Users\Admin\youtube; python scripts\telegram_reporter.py --report content_brief --send --approve APPROVE
    depends: [approve_content_brief]

  - id: final_note
    run: Write-Host "WF22 complete. Alan approved, brief delivered to the EDIT topic, editor can start."
    depends: [brief_to_editor]
